   나라장터 25시 — 조달 마스터의 하루
   단일 HTML5 캔버스 게임 (외부 라이브러리 없음)

'use strict';

const W = 1920, H = 1080;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const bootEl = document.getElementById('boot');

const FONT = '"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
const font = (size, weight) => `${weight || 700} ${size}px ${FONT}`;

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const TAU = Math.PI * 2;

// 결정론적 난수 (시연 모드 재현용)
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function shadow(c, blur, dy, color) {
  c.shadowBlur = blur; c.shadowOffsetY = dy; c.shadowColor = color;
}
function noShadow(c) { c.shadowBlur = 0; c.shadowOffsetY = 0; c.shadowColor = 'transparent'; }

function text(c, str, x, y, o) {
  o = o || {};
  c.font = font(o.size || 24, o.weight || 700);
  c.fillStyle = o.color || '#17233f';
  c.textAlign = o.align || 'left';
  c.textBaseline = o.baseline || 'alphabetic';
  if (o.maxWidth) c.fillText(str, x, y, o.maxWidth);
  else c.fillText(str, x, y);
}

// 한국어 줄바꿈: 어절 단위
function wrapLines(c, str, maxW, size, weight) {
  c.font = font(size, weight || 700);
  const words = String(str).split(' ');
  const lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (c.measureText(t).width <= maxW) cur = t;
    else {
      if (cur) lines.push(cur);
      if (c.measureText(w).width > maxW) {
        let chunk = '';
        for (const ch of w) {
          if (c.measureText(chunk + ch).width > maxW) { lines.push(chunk); chunk = ch; }
          else chunk += ch;
        }
        cur = chunk;
      } else cur = w;
    }
  }
  if (cur) lines.push(cur);
  return lines;
}

function money(n) {
  if (n <= 0) return '0원';
  const eok = Math.floor(n / 100000000);
  const man = Math.floor((n % 100000000) / 10000);
  if (eok > 0) return eok + '억' + (man > 0 ? ' ' + man.toLocaleString('ko-KR') + '만원' : '원');
  if (man > 0) return man.toLocaleString('ko-KR') + '만원';
  return n.toLocaleString('ko-KR') + '원';
}
function comma(n) { return Math.round(n).toLocaleString('ko-KR'); }
function clock(sec) {
  const s = Math.max(0, Math.ceil(sec));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

/* ------------------------------------------------------------
   사운드: Web Audio API 신시사이저 (외부 음원 없음)
   ------------------------------------------------------------ */
const Sound = {
  ctx: null, master: null, musicGain: null, muted: false, musicTimer: null, step: 0, nextTime: 0,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.9;
    this.master.connect(this.ctx.destination);
    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.0;
    this.musicGain.connect(this.master);
    // 시연 영상 녹화용 오디오 출력
    try {
      this.recDest = this.ctx.createMediaStreamDestination();
      this.master.connect(this.recDest);
    } catch (e) { this.recDest = null; }
  },
  resume() { this.init(); if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  tone(freq, dur, type, gain, when, slideTo, dest) {
    if (!this.ctx || this.muted) return;
    const t0 = when || this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + Math.min(0.02, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    o.connect(g); g.connect(dest || this.master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noise(dur, gain, hz, when, dest) {
    if (!this.ctx || this.muted) return;
    const t0 = when || this.ctx.currentTime;
    const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const bp = this.ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = hz || 2400; bp.Q.value = 1.2;
    const g = this.ctx.createGain(); g.gain.value = gain;
    src.connect(bp); bp.connect(g); g.connect(dest || this.master);
    src.start(t0);
  },
  pick() { this.tone(520, 0.09, 'triangle', 0.16); },
  drop() { this.tone(320, 0.1, 'sine', 0.14, 0, 260); },
  correct(combo) {
    const base = 523.25 * Math.pow(2, Math.min(combo, 12) / 12);
    this.tone(base, 0.12, 'triangle', 0.2);
    this.tone(base * 1.5, 0.16, 'triangle', 0.14, this.ctx ? this.ctx.currentTime + 0.06 : 0);
  },
  wrong() {
    this.tone(196, 0.22, 'sawtooth', 0.14, 0, 110);
    this.noise(0.12, 0.08, 800);
  },
  miss() { this.tone(140, 0.25, 'sine', 0.16, 0, 70); },
  tick() { this.tone(1180, 0.05, 'square', 0.07); },
  start() { [523, 659, 784].forEach((f, i) => this.tone(f, 0.16, 'triangle', 0.16, this.ctx ? this.ctx.currentTime + i * 0.08 : 0)); },
  end(win) {
    const seq = win ? [523, 659, 784, 1046] : [523, 466, 392, 311];
    seq.forEach((f, i) => this.tone(f, 0.3, 'triangle', 0.18, this.ctx ? this.ctx.currentTime + i * 0.13 : 0));
  },
  stamp() { this.noise(0.16, 0.22, 500); this.tone(150, 0.16, 'sine', 0.2, 0, 60); },

  // 배경음: 8분음표 스케줄러
  BASS: [110.0, 0, 110.0, 0, 130.81, 0, 146.83, 0, 110.0, 0, 110.0, 0, 164.81, 0, 146.83, 0],
  ARP: [0, 440, 0, 523.25, 0, 587.33, 659.25, 0, 0, 440, 0, 523.25, 587.33, 0, 659.25, 783.99],
  startMusic() {
    this.init(); if (!this.ctx) return;
    if (this.musicTimer) return;
    const beat = 60 / 118 / 2; // 8분음표
    this.nextTime = this.ctx.currentTime + 0.1;
    this.step = 0;
    this.musicGain.gain.cancelScheduledValues(this.ctx.currentTime);
    this.musicGain.gain.setTargetAtTime(0.5, this.ctx.currentTime, 0.6);
    this.musicTimer = setInterval(() => {
      if (!this.ctx) return;
      while (this.nextTime < this.ctx.currentTime + 0.4) {
        const s = this.step % 16, t = this.nextTime;
        const b = this.BASS[s];
        if (b) this.tone(b, beat * 1.7, 'triangle', 0.22, t, null, this.musicGain);
        const a = this.ARP[s];
        if (a) this.tone(a, beat * 1.1, 'square', 0.055, t, null, this.musicGain);
        if (s % 4 === 0) this.noise(0.05, 0.1, 1800, t, this.musicGain);
        if (s % 8 === 4) this.noise(0.1, 0.13, 800, t, this.musicGain);
        this.nextTime += beat; this.step++;
      }
    }, 60);
  },
  stopMusic() {
    if (!this.ctx || !this.musicGain) return;
    this.musicGain.gain.setTargetAtTime(0.0, this.ctx.currentTime, 0.25);
    const tm = this.musicTimer; this.musicTimer = null;
    setTimeout(() => { if (tm) clearInterval(tm); }, 1200);
  }
};

  } else if (type === 'check') {
    c.beginPath(); c.moveTo(-u * 0.55, 0); c.lineTo(-u * 0.12, u * 0.45); c.lineTo(u * 0.62, -u * 0.48); c.stroke();
  } else if (type === 'x') {
    c.beginPath(); c.moveTo(-u * 0.5, -u * 0.5); c.lineTo(u * 0.5, u * 0.5); c.moveTo(u * 0.5, -u * 0.5); c.lineTo(-u * 0.5, u * 0.5); c.stroke();
  }
  c.restore();
}

let bgCanvas = null;

  c.fillStyle = g; c.fillRect(0, 0, W, H);

  const step = 48;
  for (let y = 24; y < H; y += step) {
    for (let x = 24; x < W; x += step) {

  const rg = c.createRadialGradient(240, -40, 20, 240, -40, 620);

/* ---------------- 요청 카드 ---------------- */
function drawCard(c, card) {
  const d = card.data;
  const w = card.w, h = card.h;
  c.save();
  c.globalAlpha = card.alpha;
  c.translate(card.x + w / 2, card.y + h / 2);
  if (card.rot) c.rotate(card.rot);
  if (card.fly) {
    const p = card.fly.t;
    c.scale(1 - 0.55 * p, 1 - 0.55 * p);
    c.globalAlpha = card.alpha * (1 - p * 0.6);
  } else {
    c.scale(card.scale, card.scale);
  }
  const x = -w / 2, y = -h / 2;

  shadow(c, card.dragging ? 34 : 16, card.dragging ? 18 : 7, card.dragging ? 'rgba(23,35,63,0.30)' : 'rgba(23,35,63,0.13)');
  c.fillStyle = '#FFFFFF';
  rr(c, x, y, w, h, 20); c.fill(); noShadow(c);
  c.lineWidth = 2; c.strokeStyle = 'rgba(23,35,63,0.08)';
  rr(c, x, y, w, h, 20); c.stroke();

  // 좌측 레일
  c.save();
  rr(c, x, y, w, h, 20); c.clip();
  c.fillStyle = d.green ? '#0E9F8C' : '#22345C';
  c.fillRect(x, y, 10, h);
  c.restore();

  // 태그 (상단 우측)
  c.font = font(16, 800);
  const tw2 = Math.min(w - 150, c.measureText(d.tag).width + (d.green ? 52 : 24));
  const pillX = x + w - 20 - tw2;
  c.fillStyle = d.green ? '#D8F3EC' : '#E8EEFA';
  rr(c, pillX, y + 18, tw2, 32, 16); c.fill();
  if (d.green) drawIcon(c, 'leaf', pillX + 20, y + 34, 16, '#0B7C6D');
  text(c, d.tag, pillX + tw2 / 2 + (d.green ? 9 : 0), y + 40, { size: 16, weight: 800, color: d.green ? '#0B7C6D' : '#3E5488', align: 'center', maxWidth: tw2 - 20 });

  // 기관 칩
  c.font = font(16, 800);
  const orgText = d.org;
  const chipW = Math.min(w - 44 - tw2 - 12, c.measureText(orgText).width + 24);
  c.fillStyle = '#EEF3FB';
  rr(c, x + 26, y + 20, chipW, 28, 14); c.fill();
  text(c, orgText, x + 26 + chipW / 2, y + 40, { size: 16, weight: 800, color: '#5A6B87', align: 'center', maxWidth: chipW - 12 });

  // 품명
  const lines = wrapLines(c, d.item, w - 52, 26, 800).slice(0, 2);
  lines.forEach((ln, k) => {
    text(c, ln, x + 26, y + 92 + k * 33, { size: 26, weight: 800, color: '#17233F' });
  });

  // 금액 / 사유
  if (d.ans === 4) {
    text(c, '부정행위 의심', x + 26, y + h - 20, { size: 21, weight: 800, color: '#E03131' });
  } else {
    text(c, '추정가 ' + money(d.amount), x + 26, y + h - 20, { size: 21, weight: 800, color: '#17233F' });
  }
  c.save();
  c.strokeStyle = 'rgba(23,35,63,0.08)'; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(x + 24, y + h - 46); c.lineTo(x + w - 24, y + h - 46); c.stroke();
  c.restore();

  if (card.wrongFlash > 0) {
    c.fillStyle = 'rgba(224,49,49,' + (0.22 * card.wrongFlash) + ')';
    rr(c, x, y, w, h, 20); c.fill();
  }
  c.restore();
}

/* ---------------- 효과 ---------------- */
function drawEffects(c) {
  // 고리
  for (const r of G.rings) {
    c.save();
    c.globalAlpha = r.life / r.max;
    c.strokeStyle = r.color; c.lineWidth = r.width;
    c.beginPath(); c.arc(r.x, r.y, r.r, 0, TAU); c.stroke();
    c.restore();
  }
  // 파티클
  for (const p of G.particles) {
    c.save();
    c.globalAlpha = clamp(p.life / p.max, 0, 1);
    c.fillStyle = p.color;
    c.translate(p.x, p.y); c.rotate(p.rot);
    if (p.shape === 'rect') c.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.62);
    else { c.beginPath(); c.arc(0, 0, p.size / 2, 0, TAU); c.fill(); }
    c.restore();
  }
  // 점수 플로터
  for (const f of G.floaters) {
    const a = clamp(f.life / f.max, 0, 1);
    c.save();
    c.globalAlpha = a;
    c.font = font(f.size, 800);
    c.textAlign = 'center';
    c.lineWidth = 6; c.strokeStyle = 'rgba(255,255,255,0.9)';
    c.strokeText(f.text, f.x, f.y);
    c.fillStyle = f.color;
    c.fillText(f.text, f.x, f.y);
    c.restore();
  }
}

function drawToasts(c) {
  let y = 128;
  for (const t of G.toasts) {

    const w = t.w, h = 64;

/* ------------------------------------------------------------
   입력 · 진행 · 시연 모드 · 녹화
   ------------------------------------------------------------ */
function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
window.addEventListener('resize', resize);
resize();

function toCanvas(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}

function binAt(x, y) {
  for (let i = 0; i < BINS.length; i++) {
    const bx = LAYOUT.binX(i), by = LAYOUT.binY, bw = LAYOUT.binW, bh = LAYOUT.binH;
    if (x >= bx && x <= bx + bw && y >= by && y <= by + bh) return i;
  }
  return -1;
}

function cardAt(x, y) {
  for (let i = G.cards.length - 1; i >= 0; i--) {
    const c = G.cards[i];
    if (c.fly || c.missT > 0) continue;
    if (x >= c.x - 8 && x <= c.x + c.w + 8 && y >= c.y - 8 && y <= c.y + c.h + 8) return c;
  }
  return null;
}

function beginDrag(card, px, py) {
  card.dragging = true;
  card.grabX = px - card.x;
  card.grabY = py - card.y;
  card.rot = 0;
  G.drag = { card, lastX: px };
  // 맨 앞으로
  const i = G.cards.indexOf(card);
  if (i >= 0) { G.cards.splice(i, 1); G.cards.push(card); }
  Sound.pick();
}

function moveDrag(px, py) {
  if (!G.drag) return;
  const card = G.drag.card;
  card.x = px - card.grabX;
  card.y = py - card.grabY;
  const dx = px - G.drag.lastX;
  G.drag.lastX = px;
  card.rot = clamp(dx * 0.0016, -0.16, 0.16);
  G.hoverBin = binAt(px, py);
}

function endDrag(px, py) {
  if (!G.drag) return;
  const card = G.drag.card;
  card.dragging = false; card.rot = 0;
  G.drag = null;
  const b = binAt(px, py);
  G.hoverBin = -1;
  if (b >= 0) resolveCard(card, b);
  else {
    card.retFromY = card.y; card.retT = 0.22;
    card.y = LAYOUT.beltY;
    Sound.drop();
  }
}

function addToast(txt, color, icon) {
  ctx.font = font(23, 800);
  const w = Math.min(W - 200, ctx.measureText(txt).width + 96);
  G.toasts.push({ text: txt, w, life: 2.4, max: 2.4, color: color || '#17233F', icon: icon || 'x' });
  if (G.toasts.length > 3) G.toasts.shift();
}

function burst(x, y, color, n) {
  for (let i = 0; i < (n || 18); i++) {
    const a = Math.random() * TAU, sp = 90 + Math.random() * 320;
    G.particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 0.5 + Math.random() * 0.5, max: 1, color,
      size: 6 + Math.random() * 10, rot: Math.random() * TAU,
      vr: (Math.random() - 0.5) * 12, shape: Math.random() < 0.5 ? 'rect' : 'circle'
    });
  }
}

function floatText(x, y, txt, color, size) {
  G.floaters.push({ x, y, text: txt, color: color || '#2F6FED', size: size || 34, life: 1.1, max: 1.1 });
}

function resolveCard(card, binIndex) {
  const d = card.data;
  const right = d.ans === binIndex;
  if (right) {
    G.combo++;
    G.bestCombo = Math.max(G.bestCombo, G.combo);
    G.correct++;
    G.binCount[binIndex]++;
    const mult = 1 + Math.min(G.combo, 10) * 0.1;
    const pts = Math.round(100 * mult * (d.green ? 1.5 : 1));
    G.score += pts;
    const save = (d.ans === 4 ? 8000000 : d.amount * 0.035) * (d.green ? 1.5 : 1);
    G.saved += save;
    G.risk = Math.max(0, G.risk - 2);
    G.binPulse[binIndex] = 1;
    G.narmi.wing = 0.4;
    const bx = LAYOUT.binX(binIndex) + LAYOUT.binW / 2;
    const by = LAYOUT.binY + 60;
    burst(bx, by, BINS[binIndex].color, d.green ? 30 : 20);
    G.rings.push({ x: bx, y: by, r: 30, life: 0.5, max: 0.5, color: BINS[binIndex].color, width: 5 });
    floatText(bx, by - 40, '+' + comma(pts), BINS[binIndex].color, 38);
    if (d.green) floatText(bx, by + 24, '녹색구매 보너스', '#0E9F8C', 24);
    card.fly = { t: 0, fromX: card.x, fromY: card.y, toX: bx - card.w / 2, toY: by - card.h / 2 };
    Sound.correct(G.combo);
    if (G.combo === 5) { G.narmi.bubble = '콤보 5! 손이 빨라요'; G.narmi.bubbleT = 2.2; }
    if (G.combo === 10) { G.narmi.bubble = '조달 마스터의 손놀림!'; G.narmi.bubbleT = 2.2; }
  } else {
    G.combo = 0;
    G.wrong++;
    G.risk = Math.min(100, G.risk + 14);
    G.binShake[binIndex] = 0.5;
    card.wrongFlash = 1;
    card.retFromY = card.y; card.retT = 0.22;
    card.y = LAYOUT.beltY;
    addToast(d.why, '#C92A2A', 'x');
    G.narmi.bubble = '태그를 다시 읽어 보세요';
    G.narmi.bubbleT = 2.0;
    G.shakeT = 0.28; G.shakeMag = 9;
    G.flashT = 0.25; G.flashColor = '#E03131';
    Sound.wrong();
    if (G.risk >= 100) endGame('risk');
  }
}

function endGame(reason) {
  if (G.scene !== 'play') return;
  G.scene = 'result'; G.sceneT = 0;
  G.endReason = reason || 'time';
  G.grade = gradeOf(G.score).g;
  G.scoreShown = 0;
  G.drag = null;
  Sound.stopMusic();
  Sound.end(reason !== 'risk');
}

function startGame() {
  Sound.resume();
  Sound.start();
  resetGame(G.demo ? 45 : 90);
  G.narmi.bubble = '요청이 밀려옵니다. 순서대로 처리해요!';
  G.narmi.bubbleT = 3.4;
}

/* ---------------- 업데이트 ---------------- */
function update(dt) {
  G.t += dt; G.sceneT += dt;

  if (G.narmi.bubbleT > 0) G.narmi.bubbleT -= dt;
  if (G.narmi.wing > 0) G.narmi.wing -= dt;
  if (G.shakeT > 0) G.shakeT -= dt;
  if (G.flashT > 0) G.flashT -= dt;
  for (let i = 0; i < 5; i++) {
    if (G.binPulse[i] > 0) G.binPulse[i] = Math.max(0, G.binPulse[i] - dt * 2.2);
    if (G.binShake[i] > 0) G.binShake[i] = Math.max(0, G.binShake[i] - dt * 1.6);
  }

  // 효과 갱신
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const p = G.particles[i];
    p.life -= dt; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.life <= 0) G.particles.splice(i, 1);
  }
  for (let i = G.floaters.length - 1; i >= 0; i--) {
    const f = G.floaters[i];
    f.life -= dt; f.y -= 62 * dt;
    if (f.life <= 0) G.floaters.splice(i, 1);
  }
  for (let i = G.rings.length - 1; i >= 0; i--) {
    const r = G.rings[i];
    r.life -= dt; r.r += 420 * dt;
    if (r.life <= 0) G.rings.splice(i, 1);
  }
  for (let i = G.toasts.length - 1; i >= 0; i--) {
    G.toasts[i].life -= dt;
    if (G.toasts[i].life <= 0) G.toasts.splice(i, 1);
  }

  if (G.scene === 'play') {
    G.timeLeft -= dt;
    G.progress = clamp(1 - G.timeLeft / G.total, 0, 1);
    if (G.tutorialT > 0) G.tutorialT -= dt;

    // 마지막 10초 틱
    const sec = Math.ceil(G.timeLeft);
    if (sec <= 10 && sec !== G.lastTick && sec > 0) { G.lastTick = sec; Sound.tick(); }

    // 스폰
    G.spawnTimer -= dt;
    if (G.spawnTimer <= 0) {
      spawnCard();
      G.interval = lerp(1.7, 1.2, G.progress);
      G.spawnTimer = G.interval;
    }

    // 카드 진행
    const speed = lerp(300, 335, G.progress);
    for (let i = G.cards.length - 1; i >= 0; i--) {
      const card = G.cards[i];
      card.age += dt;
      if (card.scale < 1) card.scale = Math.min(1, card.scale + dt * 5);
      if (card.wrongFlash > 0) card.wrongFlash = Math.max(0, card.wrongFlash - dt * 2.4);
      if (card.retT > 0) {
        card.retT -= dt;
        card.y = lerp(card.retFromY, LAYOUT.beltY, easeOut(1 - Math.max(0, card.retT) / 0.22));
      }
      if (card.fly) {
        card.fly.t += dt / 0.3;
        const p = clamp(card.fly.t, 0, 1);
        card.x = lerp(card.fly.fromX, card.fly.toX, easeOut(p));
        card.y = lerp(card.fly.fromY, card.fly.toY, easeOut(p));
        if (p >= 1) G.cards.splice(i, 1);
        continue;
      }
      if (card.missT > 0) {
        card.missT -= dt; card.alpha -= dt * 3; card.x += 260 * dt;
        if (card.missT <= 0) G.cards.splice(i, 1);
        continue;
      }
      if (!card.dragging) {
        card.x += speed * dt;
        if (card.x > W + 40) {
          G.missed++; G.combo = 0; G.risk = Math.min(100, G.risk + 9);
          card.missT = 0.3;
          addToast('요청이 반려되었습니다 — 시간 안에 처리하지 못했어요', '#7A4A00', 'x');
          G.shakeT = 0.2; G.shakeMag = 6;
          Sound.miss();
          if (G.risk >= 100) endGame('risk');
        }
      }
    }

    if (G.timeLeft <= 0) endGame('time');
  } else if (G.scene === 'result') {
    G.scoreShown += (G.score - G.scoreShown) * Math.min(1, dt * 5);
    if (G.score - G.scoreShown < 1) G.scoreShown = G.score;
    if (G.sceneT > 0.4 && G.sceneT - dt <= 0.4) Sound.stamp();
    for (let i = G.cards.length - 1; i >= 0; i--) {
      const card = G.cards[i];
      card.alpha = Math.max(0, card.alpha - dt * 4);
      if (card.fly) { card.fly.t += dt / 0.3; card.x = lerp(card.fly.fromX, card.fly.toX, clamp(card.fly.t, 0, 1)); }
      if (card.alpha <= 0.01) G.cards.splice(i, 1);
    }
  }
}

/* ---------------- 시연(자동 플레이) ---------------- */
const Auto = {
  on: false, t: 0, d: null, started: false, resolved: 0, mistakes: [3, 9, 15], mistakeAt: 0,
  reset() { this.d = null; this.started = false; this.resolved = 0; this.mistakeAt = 0; this.t = 0; },
  update(dt) {
    if (!this.on) return;
    this.t += dt;
    if (G.scene === 'title') {
      if (this.t > 3.4 && !this.started) { this.started = true; startGame(); }
      return;
    }
    if (G.scene === 'result') return;
    if (this.d) {
      const d = this.d;
      d.t += dt;
      const p = clamp(d.t / d.dur, 0, 1);
      const e = easeInOut(p);
      const mt = 1 - e;
      const px = mt * mt * d.p0.x + 2 * mt * e * d.cp.x + e * e * d.p1.x;
      const py = mt * mt * d.p0.y + 2 * mt * e * d.cp.y + e * e * d.p1.y;
      moveDrag(px, py);
      if (p >= 1 && d.t > d.dur + d.hold) {
        const card = d.card;
        endDrag(d.p1.x, d.p1.y);
        this.d = null;
        this.resolved++;
        if (card.data && card.fly) this.lastCorrect = card.data.ans;
      }
      return;
    }
    // 다음 카드 선택: 3장 이상 쌓이거나 급해지면 몰아서 처리
    let best = null, queued = 0, urgent = null;
    for (const c of G.cards) {
      if (c.dragging || c.fly || c.missT > 0 || c.retT > 0) continue;
      if (c.age < 0.4) continue;
      if (c.x > W - 700) urgent = c;
      if (!best || c.x > best.x) best = c;
      queued++;
    }
    if (!best) return;
    if (this.resolved > 0 && queued < 3 && !urgent && best.age < 2.2) return;
    const d = best.data;
    const mistake = this.mistakeAt < this.mistakes.length && this.resolved === this.mistakes[this.mistakeAt];
    let bin = d.ans;
    if (mistake) { bin = (d.ans + 2) % 5; this.mistakeAt++; }
    const bx = LAYOUT.binX(bin) + LAYOUT.binW / 2 + (Math.random() * 30 - 15);
    const by = LAYOUT.binY + 90 + (Math.random() * 24 - 12);
    beginDrag(best, best.x + best.w / 2, best.y + best.h / 2);
    this.d = {
      card: best, t: 0, dur: 0.5 + Math.random() * 0.16, hold: 0.08,
      p0: { x: best.x + best.w / 2, y: best.y + best.h / 2 },
      cp: { x: lerp(best.x + best.w / 2, bx, 0.5), y: Math.min(best.y, by) - 130 },
      p1: { x: bx, y: by }
    };
  }
};

/* ---------------- 녹화 (시연 영상 촬영용, 분할 저장) ---------------- */
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

async function recordDemo(totalSec, chunkSec) {
  Sound.resume();
  Auto.on = true; Auto.reset();
  G.demo = true; G.paused = false;
  G.scene = 'title'; G.sceneT = 0; G.t = 0;
  G.cards = []; G.particles = []; G.floaters = []; G.toasts = []; G.rings = [];
  document.title = 'REC...';
  await new Promise(r => setTimeout(r, 400));

  const parts = Math.max(1, Math.ceil(totalSec / chunkSec));
  const types = ['video/mp4;codecs=avc1.4D401F,mp4a.40.2', 'video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus'];
  let mime = '';
  for (const t of types) { if (MediaRecorder.isTypeSupported(t)) { mime = t; break; } }

  for (let i = 0; i < parts; i++) {
    const sec = Math.min(chunkSec, totalSec - i * chunkSec);
    const vStream = canvas.captureStream(60);
    const audioTracks = Sound.recDest ? Sound.recDest.stream.getAudioTracks() : [];
    const stream = new MediaStream([...vStream.getVideoTracks(), ...audioTracks]);
    const rec = new MediaRecorder(stream, { mimeType: mime || undefined, videoBitsPerSecond: 4500000, audioBitsPerSecond: 128000 });
    const chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    const stopped = new Promise(r => { rec.onstop = r; });
    rec.start(400);
    await new Promise(r => setTimeout(r, sec * 1000));
    G.paused = true;
    rec.stop();
    await stopped;
    const blob = new Blob(chunks, { type: mime.startsWith('video/mp4') ? 'video/mp4' : 'video/webm' });
    downloadBlob(blob, 'narajangteo25-p' + (i + 1) + (blob.type.includes('mp4') ? '.mp4' : '.webm'));
    document.title = 'PART ' + (i + 1) + '/' + parts + ' ' + Math.round(blob.size / 1048576 * 10) / 10 + 'MB';
    await new Promise(r => setTimeout(r, 700));
    G.paused = false;
  }
  document.title = 'DONE ' + JSON.stringify({ mime, parts, totalSec, chunkSec });
  return { mime, parts };
}

/* ---------------- 이벤트 ---------------- */
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  Sound.resume();
  const p = toCanvas(e);
  G.pointer.x = p.x; G.pointer.y = p.y; G.pointer.down = true;
  if (G.scene === 'title') { startGame(); return; }
  if (G.scene === 'result') {
    if (G.sceneT > 1.0) { G.scene = 'title'; G.sceneT = 0; Auto.reset(); }
    return;
  }
  const card = cardAt(p.x, p.y);
  if (card) beginDrag(card, p.x, p.y);
});
canvas.addEventListener('pointermove', e => {
  const p = toCanvas(e);
  G.pointer.x = p.x; G.pointer.y = p.y;
  if (G.drag) moveDrag(p.x, p.y);
});
window.addEventListener('pointerup', e => {
  if (!G.drag) return;
  const p = toCanvas(e);
  endDrag(p.x, p.y);
  G.pointer.down = false;
});
window.addEventListener('pointercancel', () => { if (G.drag) endDrag(-999, -999); });
window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    Sound.resume();
    if (G.scene === 'title') startGame();
    else if (G.scene === 'result' && G.sceneT > 0.8) { G.scene = 'title'; G.sceneT = 0; Auto.reset(); }
  } else if (e.key === 'r' || e.key === 'R') {
    if (G.scene !== 'title') { Auto.reset(); startGame(); }
  } else if (e.key === 'm' || e.key === 'M') {
    Sound.muted = !Sound.muted; G.muted = Sound.muted;
    if (Sound.muted) Sound.stopMusic(); else if (G.scene === 'play') Sound.startMusic();
  }
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ---------------- 메인 루프 (고정 타임스텝) ---------------- */
let lastTime = performance.now(), acc = 0;
const STEP = 1 / 60;
function loop(now) {
  const dtReal = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;
  if (G.paused) { render(); requestAnimationFrame(loop); return; }
  acc += dtReal;
  let guard = 0;
  while (acc >= STEP && guard < 8) { Auto.update(STEP); update(STEP); acc -= STEP; guard++; }
  if (acc > STEP) acc = 0;
  render();
  requestAnimationFrame(loop);
}

// 첫 프레임은 즉시
update(0.016); render();
requestAnimationFrame(loop);

// URL 파라미터: ?demo=1 자동 시연, ?rec=1 녹화 버튼 노출
const params = new URLSearchParams(location.search);
if (params.get('demo') === '1') { Auto.on = true; Auto.reset(); G.demo = true; }
if (params.get('rec') === '1') {
  const btn = document.createElement('button');
  btn.textContent = '● 시연 영상 녹화 (62초 분할)';
  btn.style.cssText = 'position:fixed;left:12px;top:12px;z-index:99;padding:14px 22px;font:800 18px/1 "Malgun Gothic",sans-serif;border:0;border-radius:12px;background:#E03131;color:#fff;cursor:pointer;box-shadow:0 6px 18px rgba(224,49,49,.4)';
  btn.onclick = () => { btn.disabled = true; btn.textContent = '녹화 중… (분할 저장)'; recordDemo(62, 13).finally(() => { btn.textContent = '● 다시 녹화'; btn.disabled = false; }); };
  document.body.appendChild(btn);
}
